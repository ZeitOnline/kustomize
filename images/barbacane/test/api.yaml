openapi: 3.0.3
info:
  title: Barbacane image test
  version: "1"
x-barbacane-middlewares:
  - name: cors
    config:
      allowed_origins: ["*"]
      allowed_methods: [GET, POST]
paths:
  /items:
    get:
      x-barbacane-dispatch:
        name: http-upstream
        config:
          url: "env://BARBACANE_UPSTREAM"
      responses:
        "200":
          description: ok
  /suggest:
    post:
      security:
        - jwt: []
      x-barbacane-middlewares:
        - name: oidc-auth
          config:
            issuer_url: "env://OIDC_ISSUER_URL"
            audience: test
        - name: cel
          config:
            expression: "!has(request.claims.roles)"
            on_match:
              deny:
                status: 403
                code: forbidden
                message: forbidden
        - name: request-transformer
          config:
            path:
              replace:
                pattern: "^/suggest$"
                replacement: /v1/chat/completions
      x-barbacane-dispatch:
        name: ai-proxy
        config:
          provider: openai
          base_url: "env://LLM_URL"
          api_key: "env://LLM_API_KEY"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
