- op: add
  path: /spec/jobTemplate/spec/template/spec/serviceAccount
  value: baseproject
# Inject ONLY the IAM SQL user (PGUSER) into the application container. The remaining
# libpq settings (PGHOST=localhost, PGPORT, PGDATABASE, PGSSLMODE, ...) that the whole
# `cloudsql-proxy-iam` secret used to provide must now be supplied by the consuming
# project itself. The full secret is still consumed by the proxy sidecar below, which
# needs INSTANCE_CONNECTION and CLOUDSQL_PROXY_IMPERSONATION_SA.
# NOTE: the targeted app container (containers[0]) must declare an `env:` list.
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: PGUSER
    valueFrom:
      secretKeyRef:
        name: cloudsql-proxy-iam
        key: PGUSER
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/-
  value:
    name: cloud-sql-proxy
    command:
    - /cloud-sql-proxy
    - "--impersonate-service-account=$(CLOUDSQL_PROXY_IMPERSONATION_SA)"
    - --auto-iam-authn
    - --address=0.0.0.0
    - $(INSTANCE_CONNECTION)
    envFrom:
    - secretRef:
        name: cloudsql-proxy-iam
    # Kept identical to the Deployment/Job sidecar (see deployment.yaml) so the injected
    # container is uniform across workload kinds. The probe is a no-op for run-to-completion
    # CronJob pods but harmless.
    env:
    - name: CSQL_PROXY_HEALTH_CHECK
      value: "true"
    - name: CSQL_PROXY_HTTP_ADDRESS
      value: "0.0.0.0"
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.27.0@sha256:7d156a5c466e31596afd6c8ed134f19c207a297418392fdad2686524ca4e7a3c
    readinessProbe:
      httpGet:
        path: /readiness
        port: 9090
      initialDelaySeconds: 5
      periodSeconds: 10
    securityContext:
      runAsNonRoot: true
