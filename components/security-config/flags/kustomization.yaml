# The container-level part of `security-config: hardened`: the three flags on
# *every* container of a workload, addressing none of them by index or by name
# -- which a patch would have to do, since a JSON patch needs a position and a
# strategic merge needs a container name. A `replacements` field path can say
# `containers.*` instead.
#
# The whole `securityContext` is copied at once, because `replacements` turns
# single values into strings on the way (`allowPrivilegeEscalation: "false"`),
# which the API server rejects. The container-level `securityContext` therefore
# belongs to this component -- see the README.
#
# `initContainers` get them only where one of our components adds one
# (`wait-for-migrations`); any other init container is left alone.

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
- template.yaml

replacements:
- source:
    kind: Deployment
    name: security-config-template
    fieldPath: spec.template.spec.containers.0.securityContext
  targets:
  - select:
      kind: Deployment
      labelSelector: security-config=hardened
    fieldPaths:
    - spec.template.spec.containers.*.securityContext
    options:
      create: true
  - select:
      kind: Job
      labelSelector: security-config=hardened
    fieldPaths:
    - spec.template.spec.containers.*.securityContext
    options:
      create: true
  - select:
      kind: CronJob
      labelSelector: security-config=hardened
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.*.securityContext
    options:
      create: true
  # `initContainers` only where we know there are some: a replacement cannot
  # tell a missing list from an empty one, and fails on the former
  - select:
      kind: Deployment
      labelSelector: security-config=hardened,wait-for-migrations=required
    fieldPaths:
    - spec.template.spec.initContainers.*.securityContext
    options:
      create: true
