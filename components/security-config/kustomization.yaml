apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
- hardened-all

patches:
# drop the carrier the 'hardened-all' component needs for its `replacements`;
# the patches of a component run after the components it includes
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: security-config-template
# the pod-level `fsGroup` applies to every level; merging it in keeps any other
# pod-level `securityContext` settings the target may have
- path: fsgroup.yaml
  target:
    kind: Deployment
    labelSelector: security-config in (required, hardened, hardened-all)
- path: fsgroup.yaml
  target:
    kind: Job
    labelSelector: security-config in (required, hardened, hardened-all)
- path: fsgroup-cronjob.yaml
  target:
    kind: CronJob
    labelSelector: security-config in (required, hardened, hardened-all)
# make sure `.volumes` exists on the pod spec before `hardened.yaml` appends the
# `tmp` volume to it, so that targeted resources don't have to carry a
# placeholder `volumes: []` themselves; merging an empty list leaves existing
# volumes untouched
- target:
    kind: Deployment
    labelSelector: security-config=hardened
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ignored
    spec:
      template:
        spec:
          volumes: []
- target:
    kind: Job
    labelSelector: security-config=hardened
  patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ignored
    spec:
      template:
        spec:
          volumes: []
- target:
    kind: CronJob
    labelSelector: security-config=hardened
  patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ignored
    spec:
      jobTemplate:
        spec:
          template:
            spec:
              volumes: []
- path: hardened.yaml
  target:
    kind: Deployment
    labelSelector: security-config=hardened
- path: hardened.yaml
  target:
    kind: Job
    labelSelector: security-config=hardened
- path: hardened-cronjob.yaml
  target:
    kind: CronJob
    labelSelector: security-config=hardened
