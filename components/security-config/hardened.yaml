- op: add
  path: /spec/template/spec/containers/0/securityContext
  value:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: tmp
    mountPath: /tmp
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: tmp
    emptyDir:
      medium: Memory
