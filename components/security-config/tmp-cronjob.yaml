- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
  value:
    name: tmp
    mountPath: /tmp
- op: add
  path: /spec/jobTemplate/spec/template/spec/volumes/-
  value:
    name: tmp
    emptyDir:
      medium: Memory
      sizeLimit: 64Mi   # counts against the pod's memory
