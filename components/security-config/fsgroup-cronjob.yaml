apiVersion: batch/v1
kind: CronJob
metadata:
  name: ignored   # the target selector decides what is patched
spec:
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 10000
            # the container runtime's default syscall filter (Pod Security Standards
            # `restricted`); a container can still opt out with its own `seccompProfile`
            seccompProfile:
              type: RuntimeDefault
