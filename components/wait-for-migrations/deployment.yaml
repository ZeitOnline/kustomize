---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wait-for-migrations
  labels:
    pg-services-init: required
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-migrations
          image: migrator
          command:
            - "pipenv"
            - "run"
            - "sh"
            - "/helpers/wait.sh"
          env:
            # `uv run` needs no cache, and 'security-config' makes the root
            # filesystem read-only for this container as well
            - name: UV_NO_CACHE
              value: "1"
          volumeMounts:
          - name: wait-for-migrations
            mountPath: /helpers
            readOnly: true
          # even without a cache `uv run` creates a temporary directory, and
          # 'security-config' mounts its /tmp into the first container only
          - name: wait-for-migrations-tmp
            mountPath: /tmp
      volumes:
      - name: wait-for-migrations
        configMap:
          name: wait-for-migrations
      - name: wait-for-migrations-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
