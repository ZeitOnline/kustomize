---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  labels:
    kind: postgrest
    pg-services: required
    wait-for-migrations: required
    security-config: hardened
    nginx-sidecar: required
    barbacane-sidecar: required
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  template:
    metadata:
      annotations:
        fluentbit.io/parser-postgrest: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest
          envFrom:
          - configMapRef:
              name: postgrest-config
          ports:
          - name: postgrest
            containerPort: 3000
          readinessProbe:
            httpGet:
              path: /rpc/health
              port: postgrest
          # keep serving until the load balancer has dropped the pod, which only
          # starts after it's marked as terminating -- see the README
          lifecycle:
            preStop:
              sleep:
                seconds: 20
          securityContext:
            # must be able to read the certs -- 'security-config' replaces this
            # when included, and makes them group-readable via `fsGroup` instead
            runAsUser: 0
          env: []
          volumeMounts: []
