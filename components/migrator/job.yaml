---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
  labels:
    app: migrator
    migrator: required
    pg-services: required
    security-config: hardened   # migration state lives in the database
    kustomize.toolkit.fluxcd.io/force: enabled
  annotations:
    # goldilocks' VPA may only recommend here: evicting the running migration to
    # apply new requests fails the Job (`backoffLimit: 0`), whatever the
    # namespace's update mode says
    goldilocks.fairwinds.com/vpa-update-mode: "off"
spec:
  backoffLimit: 0       # no retries please
  template:
    metadata:
      labels:
        app: migrator
    spec:
      containers:
        - name: migrator
          image: migrator
          envFrom:
          - configMapRef:
              name: migrator-config
          volumeMounts: []
      restartPolicy: Never
