- op: add
  path: /spec/template/spec/containers/-
  value:
    name: barbacane
    image: barbacane   # the project's own, carrying the compiled artefact
    args:
    - serve
    - --artifact=/config/api.bca
    - --listen=0.0.0.0:8080
    - --log-format=json
    # the upstream is a loopback address, which is plaintext by nature and
    # which the plugin sandbox refuses to call unless allowed explicitly
    - --allow-plaintext-upstream
    # longer than the load balancer's (GCP: 600 s), which reuses idle
    # connections and answers 502 when the gateway has just closed one
    - --keepalive-timeout=620
    # the admin API serves the metrics; on the pod's address rather than the
    # loopback default, so Prometheus can scrape it (see 'podmonitor.yaml')
    - --admin-bind=0.0.0.0:8081
    env:
    - name: BARBACANE_UPSTREAM
      value: http://127.0.0.1:8000   # the nginx sidecar, see the README
    - name: BARBACANE_ALLOW_INTERNAL_EGRESS
      value: "1"
    ports:
    - name: barbacane
      containerPort: 8080
    - name: barbacane-admin
      containerPort: 8081
    readinessProbe:
      httpGet:
        # through the whole chain rather than the gateway alone
        path: /rpc/health
        port: barbacane
    # every container gets its own SIGTERM, so the gateway has to wait for the
    # load balancer as well, or requests still arriving would find it gone
    lifecycle:
      preStop:
        sleep:
          seconds: 20
# the pods carry the label too, so the PodMonitor finds them
- op: add
  path: /spec/template/metadata/labels/barbacane-sidecar
  value: required
